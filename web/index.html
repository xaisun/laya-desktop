<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>laya 决策引擎 · 本地操作台</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a22; --panel2:#1c212b; --line:#272e3a;
    --text:#e7eaf0; --muted:#8b93a7; --accent:#4c8dff; --ok:#35c46b;
    --warn:#f5a524; --err:#ef5350;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font:15px/1.62 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       -webkit-font-smoothing:antialiased;overflow-wrap:break-word}
  .wrap{max-width:980px;margin:0 auto;padding:26px 18px 70px}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:19px;margin:0;font-weight:650;letter-spacing:.2px}
  .spacer{flex:1}
  .badge{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);
         background:var(--panel2);color:var(--muted);white-space:nowrap}
  .badge.ok{color:var(--ok);border-color:#1f4d35;background:#11251b}
  .badge.warn{color:var(--warn);border-color:#4e3b12;background:#2a2210}
  .badge.err{color:var(--err);border-color:#55242b;background:#2a1418}
  button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);
         background:var(--panel2);color:var(--text);padding:8px 15px;transition:.15s}
  button:hover:not(:disabled){border-color:#3b465b;background:#222836}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover:not(:disabled){background:#5d99ff;border-color:#5d99ff}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:16px 18px;margin-bottom:16px}
  .sec-title{font-size:12px;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;
             margin-bottom:12px;font-weight:600}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .chip{font-size:13.5px;padding:6px 13px;border-radius:99px;border:1px solid var(--line);
        background:var(--panel2);color:var(--muted);cursor:pointer;transition:.15s;user-select:none}
  .chip:hover{border-color:#3b465b;color:var(--text)}
  .chip.on{background:#16305a;border-color:var(--accent);color:#cfe0ff}
  .muted{color:var(--muted)}
  .hint{margin-top:10px;font-size:12.5px;line-height:1.6;color:#f0c069;background:#2a2210;
        border:1px solid #4e3b12;border-radius:8px;padding:7px 10px}
  .small{font-size:12.5px}
  label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px}
  label:first-child{margin-top:0}
  input,textarea{width:100%;background:#0d1016;border:1px solid var(--line);border-radius:9px;
       color:var(--text);padding:9px 11px;font:inherit;font-size:14px;outline:none;resize:vertical}
  input:focus,textarea:focus{border-color:var(--accent);background:#0b1119}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
  .err{border:1px solid #55242b;background:#2a1418;color:#ffb4b4;border-radius:12px;
       padding:11px 14px;margin-bottom:16px;font-size:13.5px;white-space:pre-wrap}
  .route{font-size:13px;color:var(--muted);margin-bottom:14px;padding-bottom:12px;
         border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .route b{color:var(--text);font-weight:600}
  .kbd{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:#0d1016;
       border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:#a9b6cc}
  .ans{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px;
       background:var(--panel2)}
  .ans:last-child{margin-bottom:0}
  .ans-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .ans-name{font-weight:600;font-size:14.5px}
  .tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);
       color:var(--muted);background:#0d1016}
  .ans-val{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .val{font-size:21px;font-weight:650;color:#cfe0ff;letter-spacing:.2px}
  .val.num{color:#a8e6c4}
  .conf{font-size:12.5px;color:var(--muted)}
  .bars{margin-top:10px;display:flex;flex-direction:column;gap:5px}
  .bar-row{display:flex;align-items:center;gap:9px;font-size:12.5px}
  .bar-name{width:104px;color:var(--muted);flex:none;overflow:hidden;text-overflow:ellipsis;
            white-space:nowrap}
  .bar-track{flex:1;height:7px;background:#0d1016;border-radius:99px;overflow:hidden;
             border:1px solid var(--line)}
  .bar-fill{height:100%;background:linear-gradient(90deg,#2f6fd0,#4c8dff);border-radius:99px}
  .bar-pct{width:52px;text-align:right;color:var(--muted);flex:none;
           font-family:ui-monospace,Consolas,monospace}
  footer{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);line-height:1.9}
  .spin{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--warn);
        margin-right:6px;animation:pulse 1.1s infinite ease-in-out}
  @keyframes pulse{0%,100%{opacity:.28}50%{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>laya 决策引擎</h1>
    <span id="status" class="badge">连接中…</span>
    <span class="spacer"></span>
    <button id="stopBtn">停止服务</button>
  </header>

  <div id="errBox" class="err" hidden></div>

  <section class="card">
    <div class="sec-title">选择场景</div>
    <div id="chips" class="chips"></div>
    <div id="scDesc" class="muted small"></div>
  </section>

  <section class="card">
    <div class="sec-title">输入</div>
    <div id="fields"></div>
    <div class="row">
      <button id="runBtn" class="primary">开始判断</button>
      <button id="sampleBtn">填入示例</button>
      <span id="runHint" class="muted small"></span>
    </div>
  </section>

  <section class="card" id="resultCard" hidden>
    <div class="sec-title">判断结果</div>
    <div id="route" class="route"></div>
    <div id="answers"></div>
  </section>

  <footer id="foot" class="muted small"></footer>
</div>

<script>
"use strict";

var SCENARIOS = [];
var CUR = null;
var READY = false;
var T0 = Date.now();
var polling = null;

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function setErr(msg){
  var b = $("errBox");
  if(!msg){ b.hidden = true; b.textContent = ""; return; }
  b.hidden = false; b.textContent = msg;
}

/* ---------------- 状态 ---------------- */
function paintStatus(st){
  var el = $("status");
  var ph = st.phase;
  READY = (ph === "ready");
  el.className = "badge";
  if(ph === "ready"){
    el.classList.add("ok");
    el.textContent = "就绪 · 加载 " + (st.load_seconds != null ? st.load_seconds + "s" : "—")
                   + " · 已完成 " + (st.requests || 0) + " 次判断";
    clearInterval(polling); polling = null;
  }else if(ph === "error"){
    el.classList.add("err");
    el.textContent = "加载失败";
    setErr("模型加载失败：\n" + (st.error || "未知原因"));
    clearInterval(polling); polling = null;
  }else{
    var wait = Math.round((Date.now() - T0)/1000);
    el.classList.add("warn");
    el.innerHTML = '<span class="spin"></span>' + esc(st.message || "加载中") + " · 已等 " + wait + "s";
  }
  $("runBtn").disabled = !READY;
  $("foot").innerHTML =
      "laya " + esc(st.laya_version || "?") + " · torch " + esc(st.torch_version || "?")
    + " · device cpu · 模型目录 <span class='kbd'>" + esc(st.models_dir || "?") + "</span>"
    + "<br>模型：english(421M) + multilingual(322M)　本地推理，不联网、不占显存";
}

function pollStatus(){
  fetch("/api/status").then(function(r){ return r.json(); })
    .then(function(st){
      paintStatus(st);
      // 带 ?auto=1 时，模型就绪后自动跑一次（演示 / 自测用）
      if(st.phase === "ready" && !window.__autoDone && /[?&]auto=1/.test(location.search)){
        window.__autoDone = true;
        setTimeout(run, 300);
      }
      if((st.phase === "starting" || st.phase === "loading") && !polling){
        polling = setInterval(pollStatus, 1500);
      }
    })
    .catch(function(){
      $("status").className = "badge err";
      $("status").textContent = "服务失联";
    });
}

/* ---------------- 场景 ---------------- */
function renderChips(){
  var box = $("chips");
  box.innerHTML = "";
  SCENARIOS.forEach(function(sc){
    var d = document.createElement("div");
    d.className = "chip" + (CUR && CUR.key === sc.key ? " on" : "");
    d.textContent = sc.label;
    d.onclick = function(){ selectScenario(sc.key); };
    box.appendChild(d);
  });
}

function renderFields(){
  var box = $("fields");
  box.innerHTML = "";
  if(!CUR) return;
  CUR.fields.forEach(function(f){
    var lb = document.createElement("label");
    lb.textContent = f.label;
    lb.setAttribute("for", "f_" + f.key);
    box.appendChild(lb);
    var el;
    if(f.kind === "textarea"){
      el = document.createElement("textarea");
      el.rows = f.rows || 4;
    }else{
      el = document.createElement("input");
      el.type = "text";
    }
    el.id = "f_" + f.key;
    el.placeholder = f.placeholder || "";
    el.value = (CUR.sample && CUR.sample[f.key]) || "";
    box.appendChild(el);
  });
}

function selectScenario(key){
  CUR = SCENARIOS.filter(function(s){ return s.key === key; })[0] || null;
  if(!CUR) return;
  renderChips();
  renderFields();
  $("scDesc").textContent = CUR.desc || "";
  $("resultCard").hidden = true;
  $("runHint").textContent = "示例已预填，可直接点「开始判断」";
  setErr("");
}

function collect(){
  var st = {};
  CUR.fields.forEach(function(f){
    var v = $("f_" + f.key).value.trim();
    if(v) st[f.key] = v;
  });
  return st;
}

/* ---------------- 结果渲染 ---------------- */
function bars(items, total){
  var h = '<div class="bars">';
  items.forEach(function(it){
    var pct = total > 0 ? (it.v / total * 100) : 0;
    h += '<div class="bar-row"><div class="bar-name">' + esc(it.k) + '</div>'
       + '<div class="bar-track"><div class="bar-fill" style="width:' + pct.toFixed(1) + '%"></div></div>'
       + '<div class="bar-pct">' + it.v.toFixed(3) + '</div></div>';
  });
  return h + '</div>';
}

function renderAnswers(answers){
  var host = $("answers");
  host.innerHTML = "";
  var labels = (CUR && CUR.answer_labels) || {};
  var keys = Object.keys(answers || {});
  if(!keys.length){
    host.innerHTML = '<div class="muted small">模型没返回任何字段，换个输入试。</div>';
    return;
  }
  keys.forEach(function(name){
    var a = answers[name] || {};
    var box = document.createElement("div");
    box.className = "ans";
    var html = '<div class="ans-head"><span class="ans-name">' + esc(labels[name] || name) + '</span>';
    var type = a.choice !== undefined ? "choice 单选"
             : (a.score !== undefined ? "score 打分" : (a.noul !== undefined ? "是 / 否" : "?"));
    html += '<span class="tag">' + esc(type) + '</span>';
    if("choice" in a || "score" in a){
      if(typeof a.confidence === "number"){
        html += '<span class="conf">置信度 ' + a.confidence.toFixed(3) + '</span>';
      }
    }
    html += '</div>';

    if("choice" in a){
      html += '<div class="ans-val"><span class="val">' + esc(a.choice) + '</span></div>';
      var pr = a.probabilities;
      if(pr && typeof pr === "object"){
        var items = Object.keys(pr).map(function(k){ return {k:k, v:Number(pr[k])}; });
        var tot = items.reduce(function(s,x){ return s + (isFinite(x.v) ? x.v : 0); }, 0);
        html += bars(items, tot > 0 ? tot : 1);
      }
    }else if("score" in a){
      var crit = Array.isArray(a.criteria) ? a.criteria : null;
      var maxS = crit ? crit.length - 1 : null;
      html += '<div class="ans-val"><span class="val num">' + Number(a.score).toFixed(3) + '</span>'
            + (maxS != null ? '<span class="conf">/ ' + maxS + ' 档</span>' : '') + '</div>';
      var d = a.distribution;
      if(Array.isArray(d) && d.length){
        var its = d.map(function(v,i){
          return {k: crit ? String(crit[i]) : ("档 " + i), v: Number(v)};
        });
        html += bars(its, 1);
      }
    }else if("noul" in a){
      var p = Number(a.noul);
      html += '<div class="ans-val"><span class="val ' + (p >= 0.5 ? "" : "num") + '">'
            + (p >= 0.5 ? "是" : "否") + '</span>'
            + '<span class="conf">P(是) = ' + p.toFixed(3) + '</span></div>';
        html += bars([{k:"是", v:p}, {k:"否", v:1-p}], 1);
      if(window.LAST_MODEL && window.LAST_MODEL !== "english"){
        html += '<div class="hint">⚠ 实测提醒：走 <b>' + esc(window.LAST_MODEL)
              + '</b> checkpoint 时，「是/否」判断不可靠 —— 中文样例里把明确的流失威胁判成了 P(是)≈0.23。'
              + '中文场景请优先用 choice / score 型，或补中文样本微调。</div>';
      }
    }else{
      html += '<div class="val">' + esc(JSON.stringify(a)) + '</div>';
    }
    box.innerHTML = html;
    host.appendChild(box);
  });
}

/* ---------------- 动作 ---------------- */
function run(){
  if(!CUR || !READY) return;
  var st = collect();
  if(!Object.keys(st).length){ setErr("输入为空，至少填一个字段。"); return; }
  setErr("");
  $("runBtn").disabled = true;
  $("runHint").innerHTML = '<span class="spin"></span>推理中…（CPU 首次约 150-350ms）';
  var t = Date.now();
  fetch("/api/predict", {
    method: "POST",
    headers: {"Content-Type": "application/json; charset=utf-8"},
    body: JSON.stringify({scenario: CUR.key, state: st})
  }).then(function(r){ return r.json(); })
    .then(function(res){
      $("runBtn").disabled = !READY;
      $("runHint").textContent = "本次往返 " + (Date.now() - t) + " ms";
      if(!res.ok){
        setErr("判断失败：" + res.error);
        $("resultCard").hidden = true;
        return;
      }
      var r = res.routing || {};
      window.LAST_MODEL = r.model || null;
      $("route").innerHTML =
          "路由 → <b>" + esc(r.model || "?") + "</b>"
        + ' <span class="kbd">' + esc(r.reason || "") + "</span>"
        + " · 推理 <b>" + res.elapsed_ms + " ms</b>";
      renderAnswers(res.answers);
      $("resultCard").hidden = false;
      pollStatus();
    })
    .catch(function(e){
      $("runBtn").disabled = !READY;
      $("runHint").textContent = "";
      setErr("请求失败：" + e);
    });
}

$("runBtn").onclick = run;
$("sampleBtn").onclick = function(){
  if(!CUR) return;
  CUR.fields.forEach(function(f){
    $("f_" + f.key).value = (CUR.sample && CUR.sample[f.key]) || "";
  });
};
$("stopBtn").onclick = function(){
  if(!confirm("停止 laya 服务？停止后本页会失效，可重新双击桌面启动器。")) return;
  fetch("/api/shutdown", {method: "POST"}).then(function(){
    $("status").className = "badge err";
    $("status").textContent = "服务已停止";
    setErr("服务已停止。可以关掉这个页面，或重新双击桌面「启动 laya」。");
    $("runBtn").disabled = true;
  });
};

/* ---------------- 启动 ---------------- */
fetch("/api/scenarios").then(function(r){ return r.json(); })
  .then(function(d){
    SCENARIOS = d.scenarios || [];
    if(SCENARIOS.length) selectScenario(SCENARIOS[0].key);
  })
  .catch(function(e){ setErr("拿场景列表失败：" + e); });
pollStatus();
</script>
</body>
</html>
